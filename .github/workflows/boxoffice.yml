name: Aggiorna box office

# Ogni lunedi' alle 07:00 UTC (09:00 in Italia d'estate) e su richiesta manuale.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scarica la classifica
        env:
          BOXOFFICE_FEED_URL: ${{ vars.BOXOFFICE_FEED_URL }}
        run: node scripts/update-boxoffice.mjs
      - name: Pubblica le modifiche
        run: |
          if git diff --quiet -- data/boxoffice.json; then
            echo "Nessuna modifica."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boxoffice.json
          git commit -m "Aggiorna il box office italiano"
          git push
